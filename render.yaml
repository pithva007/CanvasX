services:
  - type: web
    name: canvasx-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        sync: false
      - key: EMPTY_ROOM_GRACE_PERIOD_MS
        value: 60000
    rootDir: server

  - type: web
    name: canvasx-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SOCKET_URL
        value: https://canvasx-backend.onrender.com
      - key: VITE_API_URL
        value: https://canvasx-backend.onrender.com
    rootDir: client
